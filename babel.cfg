# Babel string-extraction config for Yasuho i18n.
# Run: pybabel extract -F babel.cfg -k _ -k ngettext:1,2 \
#          --add-comments=Translators: -o locales/yasuho.pot .
#
# --add-comments is NOT optional. Without it every `# Translators:` note in the
# source is silently dropped from the .pot, and the strings that most need one
# are the ones a translator cannot guess from the msgid alone - the seven
# weekday abbreviations in cogs/system/botstats.py are seven bare 3-letter
# msgids ("Sun" especially) with no context at all.
[python: **.py]
encoding = utf-8
